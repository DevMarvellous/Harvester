<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042A17"/>
      <stop offset="50%" stop-color="#063D22"/>
      <stop offset="100%" stop-color="#0B6B3A"/>
    </linearGradient>

    <radialGradient id="sunburst" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF4D0" stop-opacity="0.9"/>
      <stop offset="25%" stop-color="#E6C65D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#063D22" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="goldBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#D4AF37" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B6B3A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="archGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128A4C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#042A17" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="crossGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FFF4D0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="megaGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Sky / Sanctuary Background -->
  <rect width="1200" height="675" fill="url(#skyGrad)"/>

  <!-- Celestial Glow / Sunburst -->
  <circle cx="600" cy="270" r="380" fill="url(#sunburst)" filter="url(#megaGlow)"/>

  <!-- Sanctuary Cathedral Arches (Architectural Lines) -->
  <g opacity="0.25" stroke="#D4AF37" stroke-width="2" fill="none">
    <path d="M200 675 V 300 Q 200 150 600 120 Q 1000 150 1000 300 V 675"/>
    <path d="M320 675 V 340 Q 320 220 600 190 Q 880 220 880 340 V 675"/>
    <path d="M440 675 V 380 Q 440 280 600 250 Q 760 280 760 380 V 675"/>
  </g>

  <!-- Light Rays Streaming from Center -->
  <g fill="url(#goldBeam)" opacity="0.7">
    <polygon points="600,250 420,675 480,675"/>
    <polygon points="600,250 540,675 660,675"/>
    <polygon points="600,250 720,675 780,675"/>
    <polygon points="600,250 280,675 360,675"/>
    <polygon points="600,250 840,675 920,675"/>
  </g>

  <!-- Radiant Cross in Center -->
  <g filter="url(#softGlow)">
    <!-- Vertical Bar -->
    <rect x="593" y="170" width="14" height="150" rx="3" fill="url(#crossGlow)"/>
    <!-- Horizontal Bar -->
    <rect x="560" y="210" width="80" height="14" rx="3" fill="url(#crossGlow)"/>
    <!-- Radiant Halo Ring -->
    <circle cx="600" cy="217" r="46" fill="none" stroke="#FFF4D0" stroke-width="2.5" stroke-dasharray="4 6" opacity="0.8"/>
  </g>

  <!-- Rising Golden Light Particles -->
  <g fill="#FFF4D0" opacity="0.65">
    <circle cx="560" cy="380" r="3"/>
    <circle cx="640" cy="340" r="2.5"/>
    <circle cx="590" cy="420" r="2"/>
    <circle cx="620" cy="460" r="3.5"/>
    <circle cx="530" cy="490" r="2.5"/>
    <circle cx="670" cy="410" r="2"/>
    <circle cx="480" cy="450" r="3"/>
    <circle cx="720" cy="470" r="2.5"/>
    <circle cx="580" cy="310" r="1.5"/>
    <circle cx="615" cy="290" r="2"/>
  </g>

  <!-- Stage / Sanctuary Floor Base -->
  <path d="M0 560 Q 600 520 1200 560 L 1200 675 L 0 675 Z" fill="#042012"/>
  <path d="M0 580 Q 600 545 1200 580 L 1200 675 L 0 675 Z" fill="#02160C"/>

  <!-- Silhouettes of Worshippers with Raised Hands -->
  <g fill="#02140A">
    <!-- Left Group -->
    <g transform="translate(180, 480) scale(0.75)">
      <circle cx="50" cy="30" r="16"/>
      <path d="M30 60 Q 50 48 70 60 L 80 180 L 20 180 Z"/>
      <path d="M32 65 Q 10 30 5 0 Q 15 2 25 35 Z"/>
      <path d="M68 65 Q 90 30 95 0 Q 85 2 75 35 Z"/>
    </g>
    <g transform="translate(280, 495) scale(0.7)">
      <circle cx="50" cy="30" r="15"/>
      <path d="M32 58 Q 50 48 68 58 L 78 180 L 22 180 Z"/>
      <path d="M34 62 Q 18 25 15 5 Q 24 6 32 35 Z"/>
      <path d="M66 62 Q 82 25 85 5 Q 76 6 68 35 Z"/>
    </g>

    <!-- Center Left -->
    <g transform="translate(420, 510) scale(0.68)">
      <circle cx="50" cy="30" r="15"/>
      <path d="M32 58 Q 50 48 68 58 L 78 180 L 22 180 Z"/>
      <path d="M34 62 Q 10 20 5 0 Q 18 2 30 35 Z"/>
      <path d="M66 62 Q 90 20 95 0 Q 82 2 70 35 Z"/>
    </g>

    <!-- Center Right -->
    <g transform="translate(680, 505) scale(0.7)">
      <circle cx="50" cy="30" r="15"/>
      <path d="M32 58 Q 50 48 68 58 L 78 180 L 22 180 Z"/>
      <path d="M34 62 Q 15 20 10 0 Q 22 2 32 35 Z"/>
      <path d="M66 62 Q 85 20 90 0 Q 78 2 68 35 Z"/>
    </g>

    <!-- Right Group -->
    <g transform="translate(820, 485) scale(0.74)">
      <circle cx="50" cy="30" r="16"/>
      <path d="M30 60 Q 50 48 70 60 L 80 180 L 20 180 Z"/>
      <path d="M32 65 Q 10 30 5 0 Q 15 2 25 35 Z"/>
      <path d="M68 65 Q 90 30 95 0 Q 85 2 75 35 Z"/>
    </g>
    <g transform="translate(930, 500) scale(0.72)">
      <circle cx="50" cy="30" r="15"/>
      <path d="M32 58 Q 50 48 68 58 L 78 180 L 22 180 Z"/>
      <path d="M34 62 Q 12 22 8 2 Q 20 4 30 36 Z"/>
      <path d="M66 62 Q 88 22 92 2 Q 80 4 70 36 Z"/>
    </g>
  </g>

  <!-- Foreground Ambient Horizon Glow -->
  <ellipse cx="600" cy="675" rx="550" ry="80" fill="url(#sunburst)" opacity="0.3" filter="url(#softGlow)"/>
</svg>
