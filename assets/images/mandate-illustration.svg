<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mandateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042A17"/>
      <stop offset="100%" stop-color="#0B6B3A"/>
    </linearGradient>

    <linearGradient id="goldM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <filter id="mDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1000" height="450" rx="20" fill="url(#mandateBg)"/>

  <!-- Background Lines -->
  <g opacity="0.12" stroke="#D4AF37" stroke-width="1.5" fill="none">
    <circle cx="500" cy="225" r="180"/>
    <circle cx="500" cy="225" r="140" stroke-dasharray="6 6"/>
    <line x1="100" y1="225" x2="900" y2="225"/>
  </g>

  <!-- 4 Mandate Pillars Visual Layout -->
  <!-- Pillar 1: Ready in All Seasons -->
  <g transform="translate(80, 75)" filter="url(#mDrop)">
    <rect width="180" height="300" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="32" fill="url(#goldM)"/>
    <!-- Shield / Anchor Icon -->
    <path d="M90 52 L 108 59 V 75 Q 90 92 90 92 Q 72 75 72 59 V 59 Z" fill="#042A17"/>
    <text x="90" y="140" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Ready in All</text>
    <text x="90" y="162" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Seasons</text>
    <rect x="40" y="185" width="100" height="26" rx="13" fill="rgba(212,175,55,0.15)"/>
    <text x="90" y="202" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#E6C65D" text-anchor="middle">Lk 8:16-18</text>
    <text x="90" y="245" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Steadfast faith</text>
    <text x="90" y="265" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">through every storm</text>
  </g>

  <!-- Pillar 2: Fruitfulness -->
  <g transform="translate(290, 75)" filter="url(#mDrop)">
    <rect width="180" height="300" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="32" fill="url(#goldM)"/>
    <!-- Seedling / Fruit Icon -->
    <path d="M90 85 V 65 M90 65 Q 80 50 68 55 Q 70 70 90 65 M90 65 Q 100 50 112 55 Q 110 70 90 65" stroke="#042A17" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <text x="90" y="140" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Be</text>
    <text x="90" y="162" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Fruitful</text>
    <rect x="40" y="185" width="100" height="26" rx="13" fill="rgba(212,175,55,0.15)"/>
    <text x="90" y="202" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#E6C65D" text-anchor="middle">Jn 15:16-17</text>
    <text x="90" y="245" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Bearing lasting</text>
    <text x="90" y="265" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">kingdom fruit</text>
  </g>

  <!-- Pillar 3: True Servant -->
  <g transform="translate(500, 75)" filter="url(#mDrop)">
    <rect width="180" height="300" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="32" fill="url(#goldM)"/>
    <!-- Heart & Hands Icon -->
    <path d="M76 68 Q 90 52 104 68 Q 90 84 76 68 Z" fill="#042A17"/>
    <text x="90" y="140" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Be a True</text>
    <text x="90" y="162" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Servant</text>
    <rect x="40" y="185" width="100" height="26" rx="13" fill="rgba(212,175,55,0.15)"/>
    <text x="90" y="202" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#E6C65D" text-anchor="middle">2 Tim 2:15</text>
    <text x="90" y="245" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Approved worker</text>
    <text x="90" y="265" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">serving with humility</text>
  </g>

  <!-- Pillar 4: True Worshippers -->
  <g transform="translate(710, 75)" filter="url(#mDrop)">
    <rect width="180" height="300" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(212,175,55,0.3)" stroke-width="1.5"/>
    <circle cx="90" cy="70" r="32" fill="url(#goldM)"/>
    <!-- Fire / Insight Flame Icon -->
    <path d="M90 52 Q 102 65 98 75 Q 94 85 90 85 Q 86 85 82 75 Q 78 65 90 52 Z" fill="#042A17"/>
    <text x="90" y="140" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Spiritual</text>
    <text x="90" y="162" font-family="'Fraunces', serif" font-size="18" font-weight="600" fill="#FFF4D0" text-anchor="middle">Worshippers</text>
    <rect x="40" y="185" width="100" height="26" rx="13" fill="rgba(212,175,55,0.15)"/>
    <text x="90" y="202" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#E6C65D" text-anchor="middle">Rom 8:6-8</text>
    <text x="90" y="245" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">Spirit and truth in</text>
    <text x="90" y="265" font-family="'Poppins', sans-serif" font-size="11" fill="rgba(255,255,255,0.75)" text-anchor="middle">daily living</text>
  </g>
</svg>
